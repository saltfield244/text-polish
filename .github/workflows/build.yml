# ソリューション全体のReleaseビルドと、デスクトップを使わない回帰テスト。
#
# クリップボードを操作するテストは実行しない(--no-clipboard)。
# 実際のクリップボードを書き換えるため、デスクトップのないランナーでは不安定になる。
# それらと、Ctrl+C/Ctrl+V の送出を伴う端から端までの動作は、
# src/TextPolish.Tests/README.md の「Windows実機での確認手順」で見る。
#
# シークレットは使わない。テストはAPIキーを必要とせず、LLMも呼ばない。
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同じブランチへ続けてpushした場合は、古い実行を打ち切る。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build:
    # WPF・WinForms・UI Automation を参照する net10.0-windows のため、Windowsランナーが必要。
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Show SDK version
        run: dotnet --info

      # 外部NuGetパッケージに依存していないため、復元はSDK同梱の参照だけで完結する。
      - name: Build (Release)
        run: dotnet build TextPolish.sln -c Release --nologo

      # 失敗が1件でもあれば終了コード1を返すので、そのままジョブが失敗する。
      - name: Test (クリップボードを使わないもの)
        run: dotnet run --project src/TextPolish.Tests -c Release --no-build -- --no-clipboard
